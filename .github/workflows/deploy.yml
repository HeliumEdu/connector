name: "Deploy"

run-name: "Deploy `${{ inputs.version_type == 'latest' && 'latest' || inputs.specific_version }}`"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version to deploy'
        required: true
        type: choice
        default: latest
        options:
          - latest
          - specific
      specific_version:
        description: 'Specific version tag (only used if version_type is "specific", ex: 1.2.3)'
        required: false
        type: string
      ref:
        description: 'Automation only: the commit to deploy from, before its tag exists (a release tags after deploying). Leave blank for a manual deploy.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "helium-connector-deploy"

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - name: Determine version to deploy
        id: version
        uses: alexdlaird/shipshape/resolve-release@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ inputs.version_type != 'latest' && inputs.specific_version || '' }}
          ref: ${{ inputs.ref }}

  verify:
    name: Verify Release Zip
    needs: [determine-version]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify release zip
        run: ./bin/verify-release.sh "$VERSION"

  deploy:
    name: Deploy to prod
    needs: [determine-version, verify]
    uses: inertlabs/.github/.github/workflows/terraform-deploy.yml@main
    with:
      component: connector
      version: ${{ needs.determine-version.outputs.version }}
      environment: prod
      version_variable: connector_version
      status_url: https://mcp.heliumedu.com/status
      other_release_prefix: "[platform]"
    secrets:
      terraform_api_token: ${{ secrets.TERRAFORM_API_TOKEN }}
      helium_bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      helium_bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
