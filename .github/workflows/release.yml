name: Release

run-name: Release

on:
  workflow_dispatch:
    inputs:
      trigger_deploy_after_release:
        description: 'Deploy to prod after release'
        required: true
        type: boolean
        default: true
      consolidate_history:
        description: 'Reset develop to main after release (force-push).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: none
  pull-requests: none

concurrency:
  group: helium-connector-release

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      version_file: helium_connector/__init__.py
      repo_slug: HeliumEdu/connector
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  publish:
    name: Publish Lambda Package
    needs: [prereq]

    env:
      VERSION: ${{ needs.prereq.outputs.version }}

    runs-on: ubuntu-latest

    steps:
      - name: Download the release build
        uses: actions/download-artifact@v8
        with:
          name: connector-build
          path: build
          run-id: ${{ needs.prereq.outputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload to S3
        env:
          BUCKET_NAME: heliumedu
        run: |
          aws s3 cp build/connector.zip "s3://${BUCKET_NAME}/helium/connector/connector-$VERSION.zip"

  deploy:
    name: Deploy
    needs: [prereq, publish]
    if: "!cancelled() && inputs.trigger_deploy_after_release && needs.publish.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run the deploy workflow and wait for it
        id: wait-for-deploy
        uses: alexdlaird/shipshape/run-workflow@v1
        with:
          workflow: deploy.yml
          ref: develop
          token: ${{ github.token }}
          timeout-minutes: 25
          inputs: |
            version_type=specific
            specific_version=${{ needs.prereq.outputs.version }}
            ref=${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Deployment trigger summary
        if: always()
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          RUN_URL: ${{ steps.wait-for-deploy.outputs.run-url }}
        run: |
          {
            echo "### Deploy Workflow Triggered"
            echo ""
            echo "- **Version**: $VERSION"
            if [ -n "$RUN_URL" ]; then
              echo "- **Run**: $RUN_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  registry:
    name: Publish to MCP Registry
    needs: [prereq, deploy]
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      MCP_PUBLISHER_VERSION: v1.8.9

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set the release version in server.json
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
        run: |
          mkdir -p build
          jq --arg version "$VERSION" '.version = $version' server.json > build/server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish build/server.json

  finish:
    needs: [prereq, publish, deploy]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: ${{ needs.publish.result == 'success' && (needs.deploy.result == 'success' || !inputs.trigger_deploy_after_release) }}
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      consolidate_history: ${{ inputs.consolidate_history }}
      version_file: helium_connector/__init__.py
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: HeliumEdu/connector
      github_release: true
      github_release_artifact: connector-build
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
