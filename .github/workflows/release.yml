name: Release

run-name: Release

on:
  workflow_dispatch:
    inputs:
      trigger_deploy_after_release:
        description: 'Deploy to prod after release'
        required: true
        type: boolean
        default: true
      consolidate_history:
        description: 'Reset develop to main after release (force-push).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  issues: none
  pull-requests: none

concurrency:
  group: helium-connector-release

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      version_file: helium_connector/__init__.py
      repo_slug: HeliumEdu/connector
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  release:
    name: Release
    needs: [prereq]

    env:
      VERSION: ${{ needs.prereq.outputs.version }}
      COMMIT_SHA: ${{ needs.prereq.outputs.squash_commit_sha }}

    runs-on: ubuntu-latest

    steps:
      - name: Download the release build
        uses: actions/download-artifact@v8
        with:
          name: connector-build
          path: build
          run-id: ${{ needs.prereq.outputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Name packages for the release
        run: |
          mv build/connector.zip "build/connector-$VERSION.zip"
          mv build/helium-plugin.zip "build/helium-plugin-$VERSION.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "build/connector-$VERSION.zip" "build/helium-plugin-$VERSION.zip" \
            --repo "${{ github.repository }}" --target "$COMMIT_SHA" --title "$VERSION" --generate-notes
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload to S3
        env:
          BUCKET_NAME: heliumedu
        run: |
          aws s3 cp "build/connector-$VERSION.zip" "s3://${BUCKET_NAME}/helium/connector/connector-$VERSION.zip"

  deploy:
    name: Deploy
    needs: [prereq, release]
    if: "!cancelled() && inputs.trigger_deploy_after_release && needs.release.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - name: Run the deploy workflow and wait for it
        uses: alexdlaird/shipshape/run-workflow@v1
        with:
          workflow: deploy.yml
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          timeout-minutes: 25
          inputs: |
            version_type=specific
            specific_version=${{ needs.prereq.outputs.version }}

  cleanup:
    needs: [prereq, release, deploy]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-cleanup.yml@main
    with:
      consolidate_history: ${{ inputs.consolidate_history && needs.release.result == 'success' }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  bump:
    needs: [release, cleanup]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/bump-version.yml
    with:
      bump_type: next
    secrets: inherit
